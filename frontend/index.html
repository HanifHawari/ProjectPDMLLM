<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- Ikon Favicon Aplikasi -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Pengaturan Viewport untuk tampilan responsif & mencegah zoom manual di mobile agar terasa seperti Native App -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FitMind AI — Platform Kebugaran dan Nutrisi</title>
    
    <!-- Meta Tag SEO Dasar -->
    <meta name="description" content="FitMind AI adalah platform kebugaran dan nutrisi berbasis AI. Dapatkan rekomendasi latihan, nutrisi, dan program yang dipersonalisasi." />
    
    <!-- Open Graph (OG) / Facebook / WhatsApp - Digunakan saat membagikan tautan di media sosial -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fitmind-ai.up.railway.app/" />
    <meta property="og:title" content="FitMind AI — Platform Kebugaran dan Nutrisi" />
    <meta property="og:description" content="FitMind AI adalah platform kebugaran dan nutrisi berbasis AI. Dapatkan rekomendasi latihan, nutrisi, dan program yang dipersonalisasi." />
    <meta property="og:image" content="https://fitmind-ai.up.railway.app/gym_hero_bg.png" />

    <!-- Twitter / Telegram Card Metadata -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://fitmind-ai.up.railway.app/" />
    <meta property="twitter:title" content="FitMind AI — Platform Kebugaran dan Nutrisi" />
    <meta property="twitter:description" content="FitMind AI adalah platform kebugaran dan nutrisi berbasis AI. Dapatkan rekomendasi latihan, nutrisi, dan program yang dipersonalisasi." />
    <meta property="twitter:image" content="https://fitmind-ai.up.railway.app/gym_hero_bg.png" />
    
    <!-- Preconnect ke Google Fonts untuk meminimalkan keterlambatan render font (FCP) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Root Container tempat aplikasi React dipasang (mounted) -->
    <div id="root"></div>
    
    <!-- Entry Point utama untuk Bundler Vite -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
